<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - neetEase</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8ff;
            color: #17245c;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #eeeeff;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #17245c;
        }

        .logo span {
            color: #5141d9;
        }

        .tagline {
            font-size: 15px;
            color: #52608c;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(60, 60, 150, 0.12);
        }

        .signup-section {
            padding: 45px 55px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #687394;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dfe2f2;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5141d9;
        }

        .signup-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #5141d9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .signup-button:hover {
            background: #4032c0;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #687394;
            font-size: 14px;
        }

        .login-link a {
            color: #5141d9;
            font-weight: bold;
            text-decoration: none;
        }

        .welcome-section {
            background: linear-gradient(135deg, #eef0ff, #f8f5ff);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 45px;
        }

        .circle {
            width: 170px;
            height: 170px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #dedcff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
        }

        .welcome-section h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .welcome-section p {
            color: #687394;
            line-height: 1.6;
        }

        @media (max-width: 750px) {

            header {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 8px;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .signup-section {
                padding: 35px 25px;
            }

            .welcome-section {
                padding: 35px 25px;
            }
        }

    </style>
</head>


<body>

<div class="page">

    <header>

        <div class="logo">
            neet<span>Ease</span>
        </div>

        <div class="tagline">
            Learn Smarter. Stay Healthy. Achieve Better.
        </div>

    </header>


    <main>

        <div class="container">

            <section class="signup-section">

                <h1>Create Account</h1>

                <p class="subtitle">
                    Join neetEase and start your NEET journey.
                </p>


                <form method="POST" action="{% url 'signup' %}">

                    {% csrf_token %}


                    <div class="input-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            name="full_name"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Mobile Number</label>

                        <input
                            type="tel"
                            name="mobile"
                            placeholder="Enter your mobile number"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                    </div>


                    <div class="input-group">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="signup-button">

                        Sign Up

                    </button>

                </form>


                <div class="login-link">

                    Already have an account?

                    <a href="{% url 'home' %}">
                        Log In
                    </a>

                </div>

            </section>


            <section class="welcome-section">

                <div>

                    <div class="circle">
                        📚
                    </div>

                    <h2>
                        Learn Smarter.
                        Achieve Better.
                    </h2>

                    <p>
                        Personalized learning,
                        progress tracking and
                        wellness support for your
                        NEET preparation.
                    </p>

                </div>

            </section>

        </div>

    </main>

</div>

</body>

</html>
